<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midnight Lab</title>

  <style>
    body{
      margin:0;
      background:black;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      overflow:hidden;
      font-family:sans-serif;
    }

    h1{
      font-size:4rem;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow{
      from{
        text-shadow:0 0 10px #fff;
      }
      to{
        text-shadow:0 0 40px #00ffff;
      }
    }
  </style>
</head>
<body>

<h1>Hello World</h1>
</body>
</html>
